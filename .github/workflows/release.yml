name: Release

# A tag vX.Y.Z builds a signed release APK and publishes it on a GitHub release:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Signing uses the repository secrets ANDROID_KEYSTORE_BASE64 (a base64 encoded
# keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
# Without them the APK is signed with a throwaway debug key: installable for
# testing, but it cannot update an APK signed with the real key.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.2.3
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          name="${TAG#v}"
          if ! echo "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "tag $TAG is not vX.Y.Z" >&2; exit 1
          fi
          core="${name%%[-+]*}"
          IFS=. read -r major minor patch <<< "$core"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "IVY_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "IVY_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "version $name ($code)"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "IVY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "IVY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "IVY_KEY_ALIAS=$KEY_ALIAS"
              echo "IVY_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signing with the release key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key"
          fi

      - name: Test
        run: ./gradlew :core:test --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ivynote-${IVY_VERSION_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 常青笔记 Android ${{ env.IVY_VERSION_NAME }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
